name: zizmor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect workflow and action changes
        id: changes
        shell: bash
        run: |
          changed_files="$(git diff --name-only HEAD^1 HEAD)"
          if grep -qE '^\.github/|(^|/)action\.ya?ml$' <<< "$changed_files"; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "No workflow or action changes, skipping zizmor."
          fi

      - name: Run zizmor
        if: steps.changes.outputs.workflows == 'true'
        uses: zizmorcore/zizmor-action@v0.9.2
        with:
          version: 1.33.1
          advanced-security: false
          annotations: true

