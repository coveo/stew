name: zizmor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect workflow and action changes
        id: changes
        uses: $/.github/workflows/actions/detect-workflow-changes

      - name: Run zizmor
        if: steps.changes.outputs.changed == 'true'
        uses: zizmorcore/zizmor-action@v0.9.2
        with:
          advanced-security: false
          annotations: true

