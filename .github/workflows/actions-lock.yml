name: actions-lock

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  actions-lock:
    name: actions-lock
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect workflow and action changes
        id: changes
        uses: $/.github/workflows/actions/detect-workflow-changes

      - name: Verify actions.lock
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify --no-interactive
